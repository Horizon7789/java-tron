name: Retry PoC reproduction

on:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      JAVA_TOOL_OPTIONS: -Xmx5g
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install PoC dependencies
        working-directory: poc-v2
        run: npm install

      - name: Apply retry instrumentation
        working-directory: poc-v2
        run: python3 apply_instrumentation.py

      - name: Build instrumented java-tron
        run: ./gradlew clean build -x test

      - name: Build PoC Docker image
        working-directory: poc-v2
        run: docker build -t retry-poc .

      - name: Start private network
        working-directory: poc-v2
        run: ./start_private_net.sh

      - name: Run PoC candidate sweep
        working-directory: poc-v2
        env:
          PRODUCER_RPC: http://127.0.0.1:9090
          VALIDATOR_RPC: http://127.0.0.1:9190
          VALIDATOR_LOG: ${{ runner.temp }}/private-net/logs/tron-node1/tron.log
        run: node run_poc.js

      - name: Run fail-closed verifier
        working-directory: poc-v2
        env:
          PRODUCER_RPC: http://127.0.0.1:9090
          VALIDATOR_RPC: http://127.0.0.1:9190
          VALIDATOR_LOG: ${{ runner.temp }}/private-net/logs/tron-node1/tron.log
        run: |
          test -s poc-result.json
          TXID="$(python3 -c 'import json; print(json.load(open("poc-result.json"))["txid"])')"
          echo "Selected transaction: $TXID"
          grep -n "RETRY_POC.*txId=$TXID" \
            "$RUNNER_TEMP/private-net/logs/tron-node1/tron.log" || true
          python3 verify_retry.py \
            --txid "$TXID" \
            --producer-rpc "$PRODUCER_RPC" \
            --validator-rpc "$VALIDATOR_RPC" \
            --validator-log "$VALIDATOR_LOG" \
            | tee verifier-output.txt

      - name: Upload PoC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-poc-evidence
          path: |
            poc-v2/poc-result.json
            poc-v2/verifier-output.txt
            ${{ runner.temp }}/private-net/logs/tron-node1/tron.log
          if-no-files-found: ignore
